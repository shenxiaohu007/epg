name: EPG‑Auto‑Build
permissions:
  contents: write
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  epg_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run EPG generation script
        run: |
          python3 get-epg.py
      - name: Commit & Push generated EPG files back to GitHub
        run: |
          git config --global user.name "epg-bot"
          git config --global user.email "epg-bot@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "EPG auto update $(date -u '+%F %T') UTC"
          git push
