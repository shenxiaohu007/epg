name: EPG‑Auto‑Build
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  epg_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run EPG generation script
        run: |
          python3 get-epg.py

      - name: Commit & Push generated EPG files back to GitHub
        run: |
          git config --global user.name "epg-bot"
          git config --global user.email "epg-bot@users.noreply.github.com"
          git add -A
          # 判断文件是否改动，没有改动直接跳过提交
          if git diff --quiet --exit-code; then
            echo "文件没有变化，跳过提交"
          else
            git commit -m "EPG auto update $(date -u '+%F %T') UTC"
            git push
          fi
